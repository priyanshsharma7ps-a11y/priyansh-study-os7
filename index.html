<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Priyansh Study OS</title><style>
*{box-sizing:border-box}body{margin:0;color:#242424;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{display:flex;min-height:100vh}.side{width:230px;background:#f7f7f5;padding:20px 14px;border-right:1px solid #e9e9e7;flex-shrink:0}.brand{font-weight:750;padding:5px 9px 22px}.logo{background:#222;color:white;padding:3px 8px;border-radius:6px;margin-right:7px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px;border-radius:7px;color:#555}.nav button.active,.nav button:hover{background:#e9e9e6;color:#222}.main{max-width:1050px;width:100%;padding:34px clamp(16px,5vw,60px);margin:0 auto}.top{display:flex;justify-content:space-between;margin-bottom:28px;color:#888;font-size:13px}.page h1{font-size:29px;margin:8px 0}.sub,.muted,.meta{color:#888;font-size:13px}.cards,.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}.card,.subject,.note{border:1px solid #e9e9e7;border-radius:10px;padding:15px}.metric{font-size:27px;font-weight:700}.progress{height:7px;background:#eee;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#287d69}.section{margin:28px 0}.section h2{font-size:18px}.row{display:flex;gap:12px;padding:12px 2px;border-bottom:1px solid #eee;align-items:flex-start}.row input{margin-top:5px;accent-color:#287d69}.row.done .task{text-decoration:line-through;color:#999}.task{font-weight:550}.meta{font-size:12px}.pill{font-size:11px;background:#f1f1ef;padding:3px 8px;border-radius:18px;color:#666}.btn,.field{border:1px solid #e5e5e5;background:white;border-radius:7px;padding:9px 12px}.btn.primary{background:#222;color:white}.toolbar{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}.tablewrap{overflow:auto;border:1px solid #eee;border-radius:9px}.table{border-collapse:collapse;width:100%;min-width:550px}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #eee;font-size:13px}.table th{background:#fafaf9;color:#777}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid #eee;border-left:1px solid #eee}.day{min-height:90px;padding:6px;border-right:1px solid #eee;border-bottom:1px solid #eee;font-size:12px}.dot{display:block;color:#287d69;font-size:10px;overflow:hidden;white-space:nowrap}.notegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.note h3{margin:0 0 7px;font-size:15px}.note p{white-space:pre-wrap;color:#888;font-size:13px}.modal{position:fixed;inset:0;background:#0005;display:grid;place-items:center;padding:15px}.dialog{background:white;border-radius:12px;padding:20px;width:min(450px,100%)}.dialog label{display:block;color:#777;font-size:13px;margin:10px 0 4px}.dialog input,.dialog select,.dialog textarea{width:100%}.dialog textarea{min-height:160px}.mobile{display:none}@media(max-width:700px){.side{position:fixed;z-index:3;top:0;bottom:0;left:-245px;transition:.2s}.side.open{left:0}.main{padding:18px 14px}.mobile{display:inline-block}.page h1{font-size:25px}.day{min-height:70px}.dot{display:none}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><span class="logo">P</span>Priyansh Study OS</div><div class="nav"><button class="active" data-page="home">⌂　Home</button><button data-page="tasks">☷　Tasks</button><button data-page="calendar">▦　Calendar</button><button data-page="notes">▤　Notes</button><button data-page="subjects">◫　Subjects</button><button data-page="progress">◷　Progress</button><button data-page="settings">⚙　Backup</button></div><p class="muted">Your personal study workspace</p></aside><main class="main"><div class="top"><span><button class="btn mobile" id="menu">☰</button> Workspace / <span id="crumb">Home</span></span><span>6 Nov 2026 – 4 Jan 2027</span></div><div id="view" class="page"></div></main></div><div id="modal"></div><script>
window.onerror=function(message,source,line,column,error){var box=document.getElementById('view');if(box){box.innerHTML='<h1>Study OS loading issue</h1><p> '+String(message)+' </p><p class="muted">Please send this message to ChatGPT.</p>'; }return true;};
var start=new Date(2026,10,6),subjects=["Maths","Science","SST","English","Hindi B","IT"];
var units={
"Maths":["Triangles: concepts and theorems","Coordinate Geometry: distance formula","Trigonometry: ratios and values","Trigonometric identities","Applications of Trigonometry","Circles: tangent theorems","Areas Related to Circles","Surface Areas and Volumes","Mixed NCERT exercise practice","Chapter-wise question practice"],
"Science":["Carbon and Its Compounds: bonding and properties","Carbon: reactions and important compounds","How do Organisms Reproduce?","Reproduction: diagrams and questions","Heredity: traits and Mendel","Heredity: practice questions","Electricity: Ohm's law and resistance","Electricity: series/parallel numericals","Magnetic Effects: concepts and diagrams","Our Environment: ecosystems and food chains"],
"SST":["Agriculture: types and cropping seasons","Agriculture: map and questions","Minerals and Energy Resources","Manufacturing Industries","Lifelines of National Economy + map","Nationalism in India","The Making of a Global World","Print Culture and the Modern World","Gender, Religion and Caste","Political Parties and Outcomes of Democracy","Development: indicators and comparison","Globalisation and the Indian Economy"],
"English":["A Letter to God: read and notes","Nelson Mandela: read and answers","Two Stories About Flying","From the Diary of Anne Frank","Glimpses of India","Mijbil the Otter","Poems: A Tiger in the Zoo / How to Tell Wild Animals","Poems: The Ball Poem / Amanda","Poems: Trees / Fog / Custard / For Anne Gregory","Writing: Formal Letter","Writing: Analytical Paragraph","Grammar: Tenses, Modals, Reported Speech","Grammar: Subject-Verb Agreement, Determiners, Integrated Grammar","Reading comprehension practice"],
"Hindi B":["व्याकरण: पदबंध और वाक्य रूपांतरण","व्याकरण: समास और मुहावरे","साखी – कबीर: भावार्थ व प्रश्न","पद – मीरा: भावार्थ व प्रश्न","मनुष्यता: सार व प्रश्न","पर्वत प्रदेश में पावस: भावार्थ","तोप: सार व प्रश्न","कर चले हम फ़िदा: सार व प्रश्न","आत्मत्राण: सार व प्रश्न","बड़े भाई साहब: प्रश्न-अभ्यास","डायरी का एक पन्ना: प्रश्न-अभ्यास","तताँरा-वामीरो कथा: प्रश्न-अभ्यास","तीसरी कसम के शिल्पकार शैलेन्द्र","अब कहाँ दूसरे के दुख से दुखी होने वाले","पतझर में टूटी पत्तियाँ / कारतूस","अपठित गद्यांश और लेखन अभ्यास"],
"IT":["Communication Skills: notes and MCQs","Self-Management Skills: notes and MCQs","ICT Skills: notes and MCQs","Entrepreneurial Skills: notes and MCQs","Green Skills: notes and MCQs","Digital Documentation: styles and formatting","Digital Documentation: images, tables and practice","Electronic Spreadsheet: formulas and functions","Spreadsheet: charts, scenarios and practice","Database Management System: concepts and queries","Web Applications and Security: notes and MCQs"]};
var review=[["Maths","Revise Real Numbers, Polynomials and Linear Equations; solve 20 mixed questions"],["Maths","Revise Quadratic Equations and AP; solve 15 questions"],["Maths","Revise Statistics and Probability; solve one mixed worksheet"],["Science","Revise Chemical Reactions, Acids-Bases-Salts and Metals-Non-metals"],["Science","Revise Life Processes and Control & Coordination with diagrams"],["Science","Revise Light and Human Eye; practise ray diagrams and numericals"],["SST","Revise Resources, Forest and Water Resources; practise map work"],["SST","Revise Sectors, Money & Credit, Nationalism in Europe"],["SST","Revise Power Sharing and Federalism with written answers"],["English","Revise Dust of Snow and Fire and Ice; practise extracts"],["English","Revise five completed Footprints chapters with short answers"],["Hindi B","Revise completed Kabir, Meera, पर्वत प्रदेश में पावस and prose chapters"]];
var tasks=[],id=1;
function add(day,s,title,kind){var d=new Date(start);d.setDate(d.getDate()+day);tasks.push({id:id++,day:day,date:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"),subject:s,title:title,kind:kind,done:false})}
for(var d=0;d<60;d++){var w=Math.floor(d/7),p=d%7;if(p===6){add(d,"Revision","Weekly revision: revise this week's chapters and error notebook","Revision");add(d,"Test","Weekly mixed test (timed) + check mistakes","Test");add(d,"IT","IT quick MCQ / practical recap","Practice");add(d,"Languages","English + Hindi B: revise literature and grammar","Revision");continue}var phase=d<28?0:d<46?1:2;var rot=["Maths","Science","SST","English","Hindi B","IT"];for(var k=0;k<4;k++){var s=rot[(p+k+w)%6];if(k===0&&d%5===0){var r=review[Math.floor(d/5)%review.length];add(d,r[0],r[1],"Revision");continue}var a=units[s],ix=Math.floor((d*1.25+w+k*2)%a.length),title=a[ix];if(phase===1)title="Practice + NCERT/PYQ: "+title;if(phase===2)title="Revision + timed questions: "+title;add(d,s,title,phase===0?"Learn":phase===1?"Practice":"Revision")}}
var key="priyansh-study-os-v2",data=JSON.parse(localStorage.getItem(key)||"null")||{tasks:tasks,notes:[]};if(!data.tasks||!data.tasks.length)data.tasks=tasks;
function save(){localStorage.setItem(key,JSON.stringify(data))}function el(x){return document.getElementById(x)}function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var page="home",filter="All";
function percent(a){return a.length?Math.round(a.filter(function(t){return t.done}).length/a.length*100):0}
function datefmt(s){return new Date(s+"T00:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"})}
function rows(a){return a.map(function(t){return '<div class="row '+(t.done?"done":"")+'"><input type="checkbox" '+(t.done?"checked":"")+' onchange="toggle('+t.id+')"><div style="flex:1"><div class="task">'+esc(t.title)+'</div><div class="meta">'+esc(t.subject)+' · '+datefmt(t.date)+' · '+esc(t.kind)+'</div></div></div>'}).join("")||'<p class="muted">No targets here.</p>'}
function go(p){page=p;document.querySelectorAll(".nav button").forEach(function(b){b.classList.toggle("active",b.dataset.page===p)});el("crumb").textContent=p.charAt(0).toUpperCase()+p.slice(1);el("side").classList.remove("open");render()}
document.querySelectorAll(".nav button").forEach(function(b){b.onclick=function(){go(b.dataset.page)}});el("menu").onclick=function(){el("side").classList.toggle("open")};
window.toggle=function(id){var t=data.tasks.find(function(x){return x.id===id});if(t){t.done=!t.done;save();render()}};
window.go=go;window.setFilter=function(x){filter=x;render()};
function render(){var v=el("view"),all=data.tasks,done=all.filter(function(t){return t.done}),today=new Date().toISOString().slice(0,10);if(page==="home"){var day=Math.max(0,Math.min(59,Math.floor((new Date(today)-start)/86400000)));v.innerHTML='<h1>Welcome to your study space 👋</h1><p class="sub">60-day Class 10 plan. One target at a time.</p><div class="cards"><div class="card"><div class="muted">Overall progress</div><div class="metric">'+percent(all)+'%</div><div class="progress"><i style="width:'+percent(all)+'%"></i></div></div><div class="card"><div class="muted">Completed targets</div><div class="metric">'+done.length+' / '+all.length+'</div></div><div class="card"><div class="muted">Plan day</div><div class="metric">'+(day+1)+' / 60</div></div></div><div class="section"><h2>Today&#39;s targets</h2>'+rows(all.filter(function(t){return t.date===today}))+'</div><div class="section"><h2>Next targets</h2>'+rows(all.filter(function(t){return t.date>=today&&!t.done}).slice(0,8))+'</div><button class="btn" onclick="go(&quot;tasks&quot;)">Open all tasks →</button>'}
if(page==="tasks"){var a=all.filter(function(t){return filter==="All"||t.subject===filter});v.innerHTML='<h1>Tasks</h1><p class="sub">Pre-filled 60-day targets. Tick each one when finished.</p><div class="toolbar"><select class="field" onchange="setFilter(this.value)"><option>All</option>'+subjects.map(function(s){return '<option '+(filter===s?"selected":"")+'>'+s+'</option>'}).join("")+'</select><button class="btn primary" onclick="addTask()">＋ Add target</button></div><div class="tablewrap"><table class="table"><tr><th>Done</th><th>Target</th><th>Subject</th><th>Date</th><th>Type</th></tr>'+a.map(function(t){return '<tr><td><input type="checkbox" '+(t.done?"checked":"")+' onchange="toggle('+t.id+')"></td><td>'+esc(t.title)+'</td><td>'+esc(t.subject)+'</td><td>'+datefmt(t.date)+'</td><td>'+esc(t.kind)+'</td></tr>'}).join("")+'</table></div>'}
if(page==="calendar"){v.innerHTML='<h1>Calendar</h1><p class="sub">Targets from 6 November 2026 to 4 January 2027.</p><div class="toolbar"><button class="btn" onclick="changeMonth(-1)">←</button><b id="monthname"></b><button class="btn" onclick="changeMonth(1)">→</button></div><div class="calendar" id="calgrid"></div>';drawCal(2026,10)}
if(page==="subjects"){v.innerHTML='<h1>Subjects</h1><p class="sub">Progress across all six subjects.</p><div class="subjects">'+subjects.map(function(s){var a=all.filter(function(t){return t.subject===s});return '<div class="subject"><b>'+s+'</b><div class="metric">'+percent(a)+'%</div><div class="progress"><i style="width:'+percent(a)+'%"></i></div><div class="meta">'+a.filter(function(t){return t.done}).length+' / '+a.length+' targets completed</div></div>'}).join("")+'</div>'}
if(page==="progress"){v.innerHTML='<h1>Progress</h1><p class="sub">Your study progress, target by target.</p><div class="cards"><div class="card"><div class="muted">Completed</div><div class="metric">'+done.length+'</div></div><div class="card"><div class="muted">Remaining</div><div class="metric">'+(all.length-done.length)+'</div></div><div class="card"><div class="muted">Completion</div><div class="metric">'+percent(all)+'%</div></div></div>'+subjects.map(function(s){var a=all.filter(function(t){return t.subject===s});return '<div class="section"><b>'+s+'</b>　<span class="muted">'+a.filter(function(t){return t.done}).length+'/'+a.length+'</span><div class="progress"><i style="width:'+percent(a)+'%"></i></div></div>'}).join("")}
if(page==="notes"){v.innerHTML='<h1>Notes</h1><p class="sub">Create and keep your own study notes.</p><button class="btn primary" onclick="addNote()">＋ New page</button><div class="notegrid" style="margin-top:15px">'+data.notes.map(function(n,i){return '<div class="note" onclick="editNote('+i+')"><h3>'+esc(n.title)+'</h3><p>'+esc(n.body.slice(0,120))+'</p><span class="meta">'+esc(n.subject||"General")+'</span></div>'}).join("")+'</div>'}
if(page==="settings"){v.innerHTML='<h1>Backup</h1><p class="sub">Your data stays in this browser on this device. Export a backup before changing devices.</p><button class="btn primary" onclick="backup()">Export backup</button> <label class="btn">Import backup<input type="file" accept="application/json" hidden onchange="restore(event)"></label><p class="muted" style="margin-top:20px">60-day plan · 6 November 2026 – 4 January 2027.</p>'}}
var cm=10,cy=2026;window.changeMonth=function(n){cm+=n;if(cm<0){cm=11;cy--}if(cm>11){cm=0;cy++}drawCal(cy,cm)};
function drawCal(y,m){cy=y;cm=m;el("monthname").textContent=new Date(y,m,1).toLocaleDateString("en-IN",{month:"long",year:"numeric"});var h=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(function(x){return '<div class="day"><b>'+x+'</b></div>'}).join(""),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(var i=0;i<first;i++)h+='<div class="day"></div>';for(var n=1;n<=days;n++){var date=y+"-"+String(m+1).padStart(2,"0")+"-"+String(n).padStart(2,"0"),a=data.tasks.filter(function(t){return t.date===date});h+='<div class="day"><b>'+n+'</b>'+a.slice(0,3).map(function(t){return '<span class="dot">• '+esc(t.subject)+'</span>'}).join("")+'</div>'}el("calgrid").innerHTML=h}
window.addTask=function(){el("modal").innerHTML='<div class="modal"><div class="dialog"><h2>Add target</h2><label>Task</label><input class="field" id="ntitle" placeholder="What will you study?"><label>Subject</label><select class="field" id="nsub">'+subjects.map(function(s){return '<option>'+s+'</option>'}).join("")+'</select><label>Date</label><input class="field" type="date" id="ndate" value="2026-11-06"><p><button class="btn primary" onclick="saveTask()">Save</button> <button class="btn" onclick="closeModal()">Cancel</button></p></div></div>'};
window.saveTask=function(){var title=el("ntitle").value.trim();if(!title)return;data.tasks.push({id:Date.now(),date:el("ndate").value,subject:el("nsub").value,title:title,kind:"Custom",done:false});save();closeModal();render()};
window.closeModal=function(){el("modal").innerHTML=""};
window.addNote=function(){var title=prompt("Note title?");if(title){data.notes.push({title:title,body:"",subject:"General"});save();render();editNote(data.notes.length-1)}};
window.editNote=function(i){var n=data.notes[i];el("modal").innerHTML='<div class="modal"><div class="dialog"><h2>Edit note</h2><label>Title</label><input class="field" id="etitle" value="'+esc(n.title)+'"><label>Subject</label><select class="field" id="esub">'+["General"].concat(subjects).map(function(s){return '<option '+(n.subject===s?"selected":"")+'>'+s+'</option>'}).join("")+'</select><label>Content</label><textarea class="field" id="ebody">'+esc(n.body)+'</textarea><p><button class="btn primary" onclick="saveNote('+i+')">Save</button> <button class="btn" onclick="delNote('+i+')">Delete</button> <button class="btn" onclick="closeModal()">Close</button></p></div></div>'};
window.saveNote=function(i){data.notes[i]={title:el("etitle").value,subject:el("esub").value,body:el("ebody").value};save();closeModal();render()};
window.delNote=function(i){if(confirm("Delete note?")){data.notes.splice(i,1);save();closeModal();render()}};
window.backup=function(){var b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="priyansh-study-os-backup.json";a.click();URL.revokeObjectURL(a.href)};
window.restore=function(e){var f=e.target.files[0],r=new FileReader();r.onload=function(){try{var x=JSON.parse(r.result);if(x.tasks){data=x;save();render();alert("Backup restored")}else alert("Invalid backup")}catch(err){alert("Could not read backup")}};r.readAsText(f)};
render();
</script></body></html>
